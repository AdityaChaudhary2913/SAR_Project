data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_event_ids:
    - e92c811f-ba53-4df2-aad0-afea8b733621
    - sen1floods11_USA
  holdout_event_ids:
    - e7e6e693-aec9-44b2-928d-80ba818b647e
  event_names:
    e7e6e693-aec9-44b2-928d-80ba818b647e: Spain_Valencia_2019
    e92c811f-ba53-4df2-aad0-afea8b733621: WestAfrica_Niger_2019
    sen1floods11_USA: USA_Midwest_2019
  sen1floods11:
    s1_dir: data/raw/sen1floods11/v1.1/data/flood_events/HandLabeled/S1Hand
    label_dir: data/raw/sen1floods11/v1.1/data/flood_events/HandLabeled/LabelHand
    train_events:
      - USA
  split_scope: chip
  val_split: 0.2
  tile_size: 256
  norm_min: -25.0
  norm_max: 0.0
  min_flood_ratio: 0.0
  derived_channels:
    - vv_minus_vh
    - vv_div_vh
  ratio_eps: 0.001

train:
  batch_size: 8
  epochs: 50
  lr: 0.0001
  device: cuda
  num_workers: 2
  seed: 42
  augment_train: true
  balance_train: true
  sampler_no_flood_max: 0.0
  sampler_low_flood_max: 0.02
  loss:
    bce_weight: 0.4
    dice_weight: 0.6

model:
  features: [32, 64, 128, 256]

paths:
  checkpoints: checkspots
  best_checkpoint: checkspots/unet_best.pth
  history: checkspots/history.npy
  metrics: checkspots/metrics.json
  rf_baseline: checkspots/rf_baseline.joblib
  results: results

demo:
  export_assets: true
  tiles_dir: backend/tiles
  registry_path: backend/tile_registry.json
